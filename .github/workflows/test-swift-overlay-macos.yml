name: Swift Overlay macOS Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Swift overlay
        run: |
          cd swift-overlay
          swift build -c release

      - name: Launch overlay
        run: |
          ./swift-overlay/.build/release/CareerCopilotOverlay > /tmp/overlay.log 2>&1 &
          echo $! > /tmp/overlay.pid
          sleep 3

      - name: Simulate F2 (listen) and F3 (toggle visibility)
        run: |
          osascript -e 'tell application "System Events" to key code 120' || echo "F2 simulation failed"
          sleep 1
          osascript -e 'tell application "System Events" to key code 99' || echo "F3 simulation failed"
          sleep 1

      - name: Screenshot after hotkeys
        run: screencapture -x /tmp/after.png
        # Only one screencapture call per run: a second call in the same
        # session previously triggered an unattended macOS screen-recording
        # consent dialog that papered over the actual screen content.

      - name: Stop overlay
        if: always()
        run: kill "$(cat /tmp/overlay.pid)" 2>/dev/null || true

      - name: Dump overlay log
        if: always()
        run: cat /tmp/overlay.log || true

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-overlay-smoke-test
          path: |
            /tmp/after.png
            /tmp/overlay.log
