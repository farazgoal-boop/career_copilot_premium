<aside class="sidebar" id="sidebar" aria-label="Main navigation">

  <!-- Header: always visible in both collapsed and expanded states -->
  <div class="sidebar-header">
    <img src="/static/icon.png" class="sidebar-logo-icon" alt="Career Copilot" />
    <span class="sidebar-logo-text">Career Copilot</span>
    <button class="sidebar-pin" id="sidebar-pin" aria-label="Pin sidebar open" title="Pin sidebar open">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <line x1="12" y1="17" x2="12" y2="22"/>
        <path d="M5 17h14v-1.5L17 12V7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v5L5 15.5V17z"/>
        <line x1="9" y1="6" x2="15" y2="6"/>
      </svg>
    </button>
  </div>

  <div class="sidebar-divider"></div>

  <nav class="sidebar-nav">

    <a href="/dashboard" class="sidebar-item" data-path="/dashboard" aria-label="Home">
      <span class="sidebar-icon sidebar-icon--home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </span>
      <span class="sidebar-label">Home</span>
    </a>

    <a href="/sessions" class="sidebar-item" data-path="/sessions" aria-label="Sessions">
      <span class="sidebar-icon sidebar-icon--sessions">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </span>
      <span class="sidebar-label">Sessions</span>
    </a>

    <a href="/prepare" class="sidebar-item" data-path="/prepare" aria-label="Prepare">
      <span class="sidebar-icon sidebar-icon--prepare">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </span>
      <span class="sidebar-label">Prepare</span>
    </a>

    <a href="/profile" class="sidebar-item" data-path="/profile" aria-label="Profile">
      <span class="sidebar-icon sidebar-icon--profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
      <span class="sidebar-label">Profile</span>
    </a>

    <a href="/system-status" class="sidebar-item" data-path="/system-status" aria-label="System Status">
      <span class="sidebar-icon sidebar-icon--system">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </span>
      <span class="sidebar-label">System Status</span>
    </a>

    <a href="/settings" class="sidebar-item" data-path="/settings" aria-label="Settings">
      <span class="sidebar-icon sidebar-icon--settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </span>
      <span class="sidebar-label">Settings</span>
    </a>

    <div class="sidebar-divider" style="margin:4px 0;"></div>

    <button class="sidebar-item sidebar-item--btn" id="sidebar-open-overlay-btn" type="button" aria-label="Open Overlay">
      <span class="sidebar-icon sidebar-icon--overlay">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </span>
      <span class="sidebar-label">Open Overlay</span>
    </button>

    <button class="sidebar-item sidebar-item--btn" type="button" onclick="window.openPairingModal?.()" aria-label="Link Device">
      <span class="sidebar-icon sidebar-icon--device">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
      </span>
      <span class="sidebar-label">Link Device</span>
    </button>

  </nav>

  <!-- Version / update check -->
  <div class="sidebar-version-area">
    <div class="version-badge">
      <span class="version-dot"></span>
      <span class="version-text">v{{ app_version }}</span>
    </div>
    <button class="update-check-btn" id="sidebar-update-check-btn" type="button" title="Check for updates">
      &#8593; Check updates
    </button>
    <div class="update-status" id="sidebar-update-status" hidden></div>
  </div>
</aside>
<script>
(function () {
  var sidebar = document.getElementById('sidebar');
  var pinBtn = document.getElementById('sidebar-pin');
  if (!sidebar || !pinBtn) return;

  var PIN_STORAGE_KEY = 'sidebar-pinned';

  function loadPinnedPref() {
    try {
      var stored = localStorage.getItem(PIN_STORAGE_KEY);
      /* Never set before -> default to pinned/open. */
      return stored === null ? true : stored === 'true';
    } catch (e) {
      return true;
    }
  }

  function savePinnedPref(pinned) {
    try { localStorage.setItem(PIN_STORAGE_KEY, String(pinned)); } catch (e) {}
  }

  function setSidebarOpen(open) {
    sidebar.classList.toggle('is-open', open);
    document.body.classList.toggle('sidebar-is-open', open);
  }

  function setPinned(pinned) {
    sidebar.classList.toggle('is-pinned', pinned);
    pinBtn.classList.toggle('is-pinned', pinned);
    pinBtn.setAttribute('aria-label', pinned ? 'Unpin sidebar' : 'Pin sidebar open');
    pinBtn.setAttribute('title', pinned ? 'Unpin sidebar' : 'Pin sidebar open');
    if (pinned) setSidebarOpen(true);
    /* when unpinning: if the mouse isn't over the sidebar, collapse right
       away rather than waiting for a mouseleave that may never fire. */
    else if (!sidebar.matches(':hover')) setSidebarOpen(false);
  }

  /* expand/collapse: mouse only — no keyboard listeners */
  sidebar.addEventListener('mouseenter', function () { setSidebarOpen(true); });
  sidebar.addEventListener('mouseleave', function () {
    /* only collapse if not pinned */
    if (!sidebar.classList.contains('is-pinned')) setSidebarOpen(false);
  });

  /* pin toggle — locks sidebar open until unpinned. Defaults to pinned/open
     on first visit (loadPinnedPref()); clicking the pin button while pinned
     unpins it and the sidebar collapses back to hover-only, same as before
     but starting from the opposite default. */
  pinBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var nowPinned = !sidebar.classList.contains('is-pinned');
    setPinned(nowPinned);
    savePinnedPref(nowPinned);
  });

  setPinned(loadPinnedPref());

  /* active state + signature shatter-out transition on nav clicks.
     Only intercepts plain left-clicks to a different page — modified
     clicks (new tab/window) and same-page clicks fall through to normal
     <a href> navigation untouched. */
  var path = window.location.pathname.replace(/\/+$/, '') || '/dashboard';
  sidebar.querySelectorAll('.sidebar-item[data-path]').forEach(function (item) {
    var isActive = item.dataset.path === path;
    if (isActive) item.classList.add('is-active');

    item.addEventListener('click', function (event) {
      if (isActive || event.defaultPrevented || event.button !== 0
          || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }
      var href = item.getAttribute('href');
      var pageContent = document.querySelector('.page-content');
      var container = document.querySelector('.premium-main');
      var prefersReducedMotion = window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!href || !pageContent || !container || !window.CC_TRANSITION || prefersReducedMotion) return;

      event.preventDefault();
      /* Record exactly where this item sits so the next page's entry
         animation can land there -- storing the click position (rather
         than re-deriving it from the destination URL on load) is what
         makes this work for dynamic routes like /session/<id>/live that
         have no matching data-path in the sidebar. See base.html. */
      var itemRect = item.getBoundingClientRect();
      var containerBox = container.getBoundingClientRect();
      try {
        sessionStorage.setItem('ccNavOriginX', String(itemRect.left + itemRect.width / 2 - containerBox.left));
        sessionStorage.setItem('ccNavOriginY', String(itemRect.top + itemRect.height / 2 - containerBox.top));
      } catch (e) {}
      CC_TRANSITION.runOut(pageContent, container).then(function () {
        window.location.href = href;
      });
    });
  });

  /* Check for updates — compares the running version against the latest
     GitHub release. Manual/click-triggered only, never auto-polled.
     Platform-specific asset matching happens server-side in /api/check-update
     (the Flask server runs on the user's own OS, so it knows the real target
     platform); the JS just uses direct_download_url when present. */
  var updateBtn = document.getElementById('sidebar-update-check-btn');
  var updateStatus = document.getElementById('sidebar-update-status');
  if (updateBtn && updateStatus) {
    updateBtn.addEventListener('click', function () {
      updateBtn.textContent = 'Checking...';
      updateBtn.disabled = true;
      fetch('/api/check-update', { headers: { Accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          updateStatus.classList.remove('update-available');
          if (d.update_available) {
            var link = document.createElement('a');
            link.href = d.direct_download_url || d.download_url || '#';
            if (!d.direct_download_url) {
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
            }
            link.textContent = 'Download Now';
            updateStatus.textContent = '\u{1F389} v' + d.latest_version + ' available! ';
            updateStatus.appendChild(link);
            updateStatus.classList.add('update-available');
          } else if (d.ok) {
            updateStatus.textContent = '✅ You are up to date';
          } else {
            updateStatus.textContent = d.error || 'Could not check. Try again.';
          }
          updateStatus.hidden = false;
        })
        .catch(function () {
          updateStatus.textContent = 'Could not check. Try again.';
          updateStatus.hidden = false;
        })
        .finally(function () {
          updateBtn.innerHTML = '&#8593; Check updates';
          updateBtn.disabled = false;
        });
    });
  }

  /* Open Overlay button — writes a flag file the overlay's poll timer picks up */
  var overlayBtn = document.getElementById('sidebar-open-overlay-btn');
  if (overlayBtn) {
    overlayBtn.addEventListener('click', function () {
      fetch('/api/overlay/show', { method: 'POST' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.ok) {
            window.showToast?.('Overlay opening…', 'success');
          } else {
            window.showToast?.(d.error || 'Could not open overlay.', 'error');
          }
        })
        .catch(function () {
          window.showToast?.('Could not reach dashboard.', 'error');
        });
    });
  }
})();
</script>
